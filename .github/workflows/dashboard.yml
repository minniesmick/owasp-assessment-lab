name: Dashboard

# Rebuilds the dashboard from the repository on every push to main and publishes it to GitHub Pages.
# Nothing is committed back to the repository.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # full history for the activity log

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: dashboard/package-lock.json

      - name: Validate repository files
        run: python3 scripts/validate.py

      - name: Build data.json
        run: python3 scripts/build_dashboard_data.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build codebase map
        run: node scripts/codebase-map.mjs --root . --out dashboard/public/codebase/index.html --title "OWASP Assessment Lab — codebase"

      - name: Build site
        working-directory: dashboard
        run: |
          npm ci
          npm run build

      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dashboard/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
