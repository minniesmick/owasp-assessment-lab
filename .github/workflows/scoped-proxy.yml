name: Scoped proxy tests

# Runs the scope-escape test suite against a real Juice Shop (service container) whenever the tool changes.
on:
  push:
    paths: ["tools/scoped-proxy/**", ".github/workflows/scoped-proxy.yml"]
  pull_request:
    paths: ["tools/scoped-proxy/**", ".github/workflows/scoped-proxy.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      juice-shop:
        image: bkimminich/juice-shop:v20.2.0
        ports: ["3000:3000"]
    defaults:
      run:
        working-directory: tools/scoped-proxy
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: tools/scoped-proxy/requirements.txt
      - run: pip install -r requirements.txt
      - name: Wait for Juice Shop
        run: |
          for i in $(seq 1 60); do
            curl -sf http://127.0.0.1:3000/rest/admin/application-version && exit 0
            sleep 3
          done
          echo "Juice Shop did not start" && exit 1
      - name: Run tests (unit + canary integration)
        run: python -m pytest -v
