# Local lab only. Ports bound to 127.0.0.1 so the vulnerable app is NOT exposed to the network.
# Version pinned so every team member tests the same build.
services:
  juice-shop:
    image: bkimminich/juice-shop:v20.2.0
    container_name: juice-shop
    ports:
      - "127.0.0.1:3000:3000"
    restart: unless-stopped
